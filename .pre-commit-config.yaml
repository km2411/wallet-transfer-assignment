repos:
  # Secret scanning — blocks leaks before they hit the remote
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # Python linting + formatting
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.6.9
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # Type checking
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.11.2
    hooks:
      - id: mypy
        args: [--ignore-missing-imports]
        additional_dependencies: []

  # Architecture boundary enforcement (see .importlinter)
  - repo: local
    hooks:
      - id: import-linter
        name: import-linter (architecture boundaries)
        entry: >-
          bash -c 'if [ -d src/wallet_transfer ]; then lint-imports;
          else echo "import-linter skip - src/wallet_transfer not created yet"; fi'
        language: system
        pass_filenames: false
